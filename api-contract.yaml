# NordicPump API Contract — Cross-repo bridge (frontend ↔ backend)
#
# Purpose: documents the runtime HTTP contract between the Angular frontend
# and the Litestar backend. Static analysis tools (graphify, codegraph) cannot
# infer these edges from imports alone, so this file makes them explicit.
#
# Each endpoint lists the backend handler (symbol + file), the backend service
# that resolves it, and the frontend service that calls it. Symbol names must
# match the actual code so the knowledge graph can link them.

contract_version: "1.0"
base_path: "/"

endpoints:
  - path: "/health"
    method: GET
    description: "Health check — always returns 200 with current UTC timestamp."
    backend:
      handler: "health_check"
      file: "backend/routes/health.py"
      resolves_with: null  # pure function, no service dependency
      response_shape:
        status: "ok"
        timestamp: "<ISO-8601 UTC>"
    frontend_callers: []  # invoked by monitoring/uptime checks, not by app UI

  - path: "/api/v1/prices/{country}"
    method: GET
    path_param:
      country: "ISO-3166 alpha-2 lowercased (se | dk | fi | no | is)"
    description: "Serve normalized fuel prices (Euro 95 + Diesel) for *country*."
    backend:
      handler: "prices_endpoint"
      file: "backend/routes/prices.py"
      factory: "create_prices_router"
      resolves_with: "PriceQueryService.resolve(target)"
      service_file: "backend/services/price_query.py"
      cache_backend: "CacheStore"
      cache_backend_file: "backend/cache/cache_store.py"
      raises:
        - "UnsupportedCountryError (HTTP 400) — invalid country code"
        - "CacheMissError (HTTP 503 + Retry-After) — cache empty/stale"
    response_shape:
      country: "<ISO-2 uppercased>"
      prices:
        - country: "<ISO-2>"
          fuel: "euro_95 | diesel"
          price_eur: "<float>"
          price_native: "<float>"
          price_native_currency: "SEK | DKK | NOK | EUR | ISK"
          price_sek: "<float>"
          date: "<YYYY-MM-DD>"
          frequency: "weekly | monthly"
    frontend_callers:
      - service: "PriceApiService"
        method: "fetch(country)"
        file: "frontend/src/app/core/services/price-api.service.ts"
        http_call: "this.http.get<PriceResponse>(`/api/v1/prices/${country}`)"
        consumers:
          - "PriceCurrentComponent"
          - "PriceChartComponent"
          - "NeighborCompareComponent"
          - "TaxBreakdownComponent"
          - "TankCalculatorComponent"

  - path: "/api/v1/rates"
    method: GET
    description: "Serve EUR→X conversion rates as floats (SEK, DKK, NOK)."
    backend:
      handler: "rates_endpoint"
      file: "backend/routes/rates.py"
      factory: "create_rates_router"
      resolves_with: "IngestionPipeline.get_rates()"
      service_file: "backend/services/ingestion_pipeline.py"
      rate_source: "ECB daily + open.er-api.com fallback (ISK)"
    response_shape:
      base: "EUR"
      rates:
        SEK: "<float>"
        DKK: "<float>"
        NOK: "<float>"
    frontend_callers:
      - service: "CurrencyService"
        method: "loadRates()"
        file: "frontend/src/app/core/services/currency.service.ts"
        http_call: "this.http.get<RatesResponse>('/api/v1/rates')"
        consumers:
          - "CurrencySwitcherComponent"
          - "TankCalculatorComponent (live conversion)"
          - "PriceCurrentComponent (currency display)"

# Explicit cross-repo edges (consumed by scripts/inject_contract_edges.py —
# matches real code nodes by exact source_file, not by label).
cross_repo_edges:
  - frontend: "PriceApiService"
    frontend_file: "frontend/src/app/core/services/price-api.service.ts"
    endpoint: "/api/v1/prices/{country}"
    backend_handler: "prices_endpoint"
    backend_service: "PriceQueryService"
    backend_service_file: "backend/services/price_query.py"
    relation: "calls_via_http"
  - frontend: "CurrencyService"
    frontend_file: "frontend/src/app/core/services/currency.service.ts"
    endpoint: "/api/v1/rates"
    backend_handler: "rates_endpoint"
    backend_service: "IngestionPipeline"
    backend_service_file: "backend/services/ingestion_pipeline.py"
    relation: "calls_via_http"
  - backend_service: "PriceQueryService"
    backend_dependency: "CacheStore"
    relation: "reads_from"
  - backend_service: "IngestionPipeline"
    backend_dependency: "CacheStore"
    relation: "writes_to"
    note: "IngestionPipeline is the only writer; PriceQueryService is the only reader."
