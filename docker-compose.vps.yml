services:
  app:
    build:
      context: /opt/nordicpump
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8000' # only the reverse proxy reaches the app (80 is Caddy's)
    environment:
      - FRONTEND_DIST_DIR=/app/frontend-dist
      # NordicPump has no DB/Redis — cache is file-based JSON with atomic writes.
      # No secrets required: all upstream APIs (fuel-prices.eu, SSB, gasvaktin,
      # ECB, open.er-api.com) are public. Settings read .env if present (empty).
    volumes:
      - appdata:/app/cache
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  appdata:
