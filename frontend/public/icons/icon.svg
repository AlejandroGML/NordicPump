<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- Pump nozzle shape -->
  <g transform="translate(120, 100)" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Nozzle body -->
    <rect x="40" y="60" width="190" height="120" rx="16" stroke-width="24" />
    <!-- Handle -->
    <line x1="200" y1="60" x2="200" y2="0" />
    <!-- Hose -->
    <path d="M 50 280 Q 30 340 80 350 Q 160 360 200 300" />
    <!-- Nozzle tip -->
    <line x1="230" y1="120" x2="280" y2="120" />
    <line x1="280" y1="120" x2="280" y2="140" />
    <!-- Drops -->
    <circle cx="290" cy="180" r="18" fill="#FFFFFF" />
    <circle cx="270" cy="220" r="12" fill="#FFFFFF" />
    <circle cx="250" cy="250" r="8" fill="#FFFFFF" />
  </g>
  <!-- NP text -->
  <text x="256" y="430" text-anchor="middle" font-family="'Fira Sans', sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">NP</text>
</svg>
