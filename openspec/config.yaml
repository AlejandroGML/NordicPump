# OpenSpec Config — NordicPump
# Auto-generated by sdd-init on 2026-06-27
schema: spec-driven

context: |
  NordicPump — fuel price comparison PWA for Nordic countries (SE, DK, FI, NO).
  Mobile-first PWA with 10 components, 6 languages, multiple official data sources.
  
  Tech stack:
    Frontend: Angular 22 + Chart.js + Tailwind + ngx-translate + @angular/pwa
    Backend:  Python 3.14 + Litestar (proxy/cache, same stack as Tiendita)
    Deploy:   Docker Compose → Fly.io (nginx + backend + optional Redis)
    Data:     fuel-prices.eu (llms.txt) + SSB Statbank API (JSON-stat)

  Architecture: SPA + REST API proxy (no DB). Backend normalizes and caches.
  Design: Nordic minimalism, #1E40AF primary, Fira Sans/Fira Code.

testing:
  strict_tdd: true
  note: "Greenfield project — test tools not installed yet but planned per stack"
  runner:
    frontend: "ng test (Karma/Jasmine) or Jest"
    backend: "pytest"
  layers:
    unit: "Jasmine/Karma (Angular) + pytest (Python)"
    integration: "Angular TestBed + httpx (Python)"
    e2e: "Playwright (planned)"
  coverage:
    frontend: "ng test --code-coverage or Jest --coverage"
    backend: "pytest --cov"
  quality:
    linter: "ESLint (Angular) + ruff (Python)"
    type_checker: "TypeScript (strict) + mypy (Python)"
    formatter: "Prettier (Angular) + ruff format (Python)"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference impacted components from PLAN.md
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover all 10 MVP components: country-selector, price-chart, price-current,
      neighbor-compare, tax-breakdown, tank-calculator, seasonality-chart,
      language-switcher, kpi-card, skeleton-loader
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect DESIGN.md visual tokens when applicable
  tasks:
    - Group by phase (backend, frontend, integration)
    - Keep tasks completable in one session
    - Use hierarchical numbering
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "ng test --watch=false && pytest"
  verify:
    test_command: "ng test --watch=false --browsers=ChromeHeadless && pytest -v"
    build_command: "ng build --configuration production"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
